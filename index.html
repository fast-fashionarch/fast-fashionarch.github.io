<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FASTFASHION | Sneaker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: white;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 1000;

  height: 70px;
  padding: 0 6%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(5,5,5,.92);
  backdrop-filter: blur(18px);

  border-bottom: 1px solid #222;
}

.logo {
  font-size: 22px;
  font-weight: 1000;
  letter-spacing: 3px;
}

.nav-link {
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
}

/* =========================
   HERO
========================= */

.hero {
  min-height: 680px;
  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;

  background:
    radial-gradient(
      circle at 75% 45%,
      rgba(255,40,40,.8),
      transparent 28%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(130,0,0,.8),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #080000,
      #9d0000 48%,
      #170000
    );
}

/* bewegende rote Fläche */

.hero::before {
  content: "";

  position: absolute;

  width: 850px;
  height: 850px;

  right: -300px;
  top: -300px;

  border-radius: 48% 52% 60% 40%;

  background:
    radial-gradient(
      circle,
      rgba(255,80,80,.7),
      transparent 60%
    );

  filter: blur(25px);

  animation: redFloat 8s ease-in-out infinite alternate;
}

@keyframes redFloat {

  from {
    transform:
      rotate(0deg)
      scale(1);
  }

  to {
    transform:
      rotate(140deg)
      scale(1.3);
  }
}

/* diagonale Linien */

.hero-lines {
  position: absolute;
  inset: 0;

  opacity: .15;

  background:
    repeating-linear-gradient(
      -25deg,
      transparent 0px,
      transparent 70px,
      white 71px,
      transparent 73px
    );
}

/* =========================
   TEXT
========================= */

.hero-content {
  position: relative;
  z-index: 10;

  width: 50%;

  padding-left: 7%;
}

.hero-small {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 5px;

  margin-bottom: 20px;
}

.hero h1 {
  font-size: clamp(60px, 10vw, 135px);

  line-height: .82;

  font-weight: 1000;

  letter-spacing: -7px;
}

.hero h1 span {
  color: #ff2222;

  -webkit-text-stroke: 1px white;
}

.hero-text {
  max-width: 450px;

  margin-top: 28px;

  font-size: 18px;

  line-height: 1.5;

  font-weight: 700;
}

.hero-button {
  display: inline-block;

  margin-top: 30px;

  padding: 16px 32px;

  border-radius: 50px;

  background: white;

  color: #111;

  text-decoration: none;

  font-size: 13px;

  font-weight: 1000;

  transition: .25s;
}

.hero-button:hover {
  transform: translateY(-4px);

  background: #ff2222;

  color: white;
}

/* =========================
   SNEAKER ILLUSTRATION
========================= */

.sneaker-area {
  position: absolute;

  right: 3%;
  bottom: 5%;

  width: 52%;
  height: 80%;

  z-index: 8;
}

/* Glow */

.sneaker-glow {
  position: absolute;

  width: 480px;
  height: 300px;

  right: 5%;
  bottom: 18%;

  background: rgba(255,30,30,.55);

  filter: blur(70px);

  border-radius: 50%;
}

/* Schuh */

.sneaker {
  position: absolute;

  width: 560px;
  height: 250px;

  right: 4%;
  bottom: 27%;

  transform:
    rotate(-13deg);

  animation:
    sneakerFloat 3.8s ease-in-out infinite alternate;
}

@keyframes sneakerFloat {

  from {
    transform:
      rotate(-13deg)
      translateY(0);
  }

  to {
    transform:
      rotate(-10deg)
      translateY(-15px);
  }
}

/* Schuhkörper */

.shoe-body {
  position: absolute;

  width: 430px;
  height: 145px;

  right: 65px;
  bottom: 65px;

  background:
    linear-gradient(
      145deg,
      #fafafa,
      #bfc4ca 55%,
      #34373b
    );

  border-radius:
    55% 35% 20% 25%;

  transform: skewX(-12deg);

  box-shadow:
    -15px 20px 0 #181818,
    15px 25px 35px rgba(0,0,0,.65);
}

/* Ferse */

.shoe-heel {
  position: absolute;

  width: 130px;
  height: 125px;

  left: 15px;
  top: 8px;

  background:
    linear-gradient(
      145deg,
      #202020,
      #050505
    );

  border-radius:
    55% 20% 15% 45%;

  transform: rotate(3deg);
}

/* Zehenbereich */

.shoe-front {
  position: absolute;

  width: 190px;
  height: 105px;

  right: -20px;
  top: 20px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #bfc2c5
    );

  border-radius:
    75% 30% 25% 40%;

  transform: rotate(-3deg);
}

/* Sohle */

.shoe-sole {
  position: absolute;

  width: 480px;
  height: 38px;

  right: 40px;
  bottom: 50px;

  background:
    linear-gradient(
      #ffffff,
      #a9adb2
    );

  border-radius: 30px;

  box-shadow:
    0 8px 0 #080808;
}

/* rote Details */

.shoe-red {
  position: absolute;

  width: 125px;
  height: 28px;

  left: 150px;
  top: 70px;

  background: #e71919;

  transform: rotate(-4deg);

  clip-path:
    polygon(
      0 20%,
      100% 0,
      80% 100%,
      15% 85%
    );
}

/* Schnürsenkel */

.laces {
  position: absolute;

  left: 210px;
  top: 35px;

  width: 150px;
  height: 80px;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 15px,
      #111 16px,
      #111 20px
    );

  transform: rotate(-7deg);
}

/* Logo-artige Fläche */

.shoe-panel {
  position: absolute;

  left: 115px;
  top: 20px;

  width: 150px;
  height: 100px;

  border-left: 5px solid #111;

  transform: skewX(-15deg);

  opacity: .7;
}

/* =========================
   AUFPRALL
========================= */

.impact {
  position: absolute;

  bottom: 19%;
  right: 20%;

  width: 330px;
  height: 100px;

  border-radius: 50%;

  border-bottom:
    7px solid rgba(255,255,255,.8);

  transform:
    perspective(300px)
    rotateX(65deg);

  filter: blur(.5px);

  animation:
    impactPulse 2s ease-in-out infinite alternate;
}

@keyframes impactPulse {

  from {
    transform:
      perspective(300px)
      rotateX(65deg)
      scale(.85);

    opacity: .4;
  }

  to {
    transform:
      perspective(300px)
      rotateX(65deg)
      scale(1.15);

    opacity: 1;
  }
}

/* Bodenrisse */

.crack {
  position: absolute;

  bottom: 8%;
  right: 13%;

  width: 450px;
  height: 100px;

  transform:
    perspective(350px)
    rotateX(65deg);

  background:
    linear-gradient(
      25deg,
      transparent 45%,
      #050505 46%,
      #050505 48%,
      transparent 49%
    ),
    linear-gradient(
      -20deg,
      transparent 48%,
      #050505 49%,
      #050505 51%,
      transparent 52%
    ),
    linear-gradient(
      75deg,
      transparent 50%,
      #050505 51%,
      #050505 53%,
      transparent 54%
    );
}

/* Staub */

.particle {
  position: absolute;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: white;

  opacity: .7;

  animation: particleFloat 2.5s infinite ease-in-out;
}

.p1 {
  right: 35%;
  bottom: 35%;
}

.p2 {
  right: 20%;
  bottom: 42%;
  width: 5px;
  height: 5px;
  animation-delay: .5s;
}

.p3 {
  right: 45%;
  bottom: 25%;
  width: 4px;
  height: 4px;
  animation-delay: 1s;
}

@keyframes particleFloat {

  0% {
    transform:
      translate(0,0)
      scale(1);

    opacity: 0;
  }

  50% {
    opacity: 1;
  }

  100% {
    transform:
      translate(30px,-60px)
      scale(.2);

    opacity: 0;
  }
}

/* =========================
   SHOP
========================= */

.shop {
  width: min(1450px, 92%);

  margin: auto;

  padding: 80px 0;
}

.shop-label {
  color: #ff2525;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 4px;

  margin-bottom: 8px;
}

.shop-title {
  font-size: clamp(40px, 6vw, 70px);

  font-weight: 1000;

  letter-spacing: -4px;

  margin-bottom: 30px;
}

/* =========================
   FILTER
========================= */

.controls {
  display: grid;

  grid-template-columns:
    2fr 1fr 1fr;

  gap: 12px;

  margin-bottom: 35px;
}

.controls input,
.controls select {
  width: 100%;

  height: 52px;

  padding: 0 16px;

  border:
    1px solid #292929;

  border-radius: 12px;

  background: #111;

  color: white;

  outline: none;
}

.controls input:focus,
.controls select:focus {
  border-color: #ff2525;
}

/* =========================
   PRODUKTE
========================= */

.products {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0,1fr));

  gap: 20px;
}

.product {
  background: #111;

  border:
    1px solid #252525;

  border-radius: 18px;

  overflow: hidden;

  transition: .3s;
}

.product:hover {
  transform: translateY(-7px);

  border-color: #ff2525;

  box-shadow:
    0 20px 60px rgba(255,0,0,.12);
}

.image-wrapper {
  position: relative;

  overflow: hidden;

  background: #191919;
}

.product-image {
  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  transition: .4s;
}

.product:hover .product-image {
  transform: scale(1.06);
}

.badge {
  position: absolute;

  top: 12px;
  left: 12px;

  padding: 6px 9px;

  border-radius: 20px;

  background: #ff2020;

  color: white;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.product-info {
  padding: 17px;
}

.brand {
  color: #888;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 2px;
}

.product-name {
  margin-top: 6px;

  font-size: 17px;

  font-weight: 900;
}

.price {
  margin: 10px 0 15px;

  font-size: 17px;

  font-weight: 900;
}

.size-select {
  width: 100%;

  height: 43px;

  margin-bottom: 9px;

  padding: 0 10px;

  border:
    1px solid #303030;

  border-radius: 9px;

  background: #080808;

  color: white;
}

.order-button {
  width: 100%;

  height: 44px;

  border: none;

  border-radius: 9px;

  background: #ff2020;

  color: white;

  font-size: 11px;

  font-weight: 1000;

  cursor: pointer;

  transition: .2s;
}

.order-button:hover {
  background: #d90000;

  transform: translateY(-2px);
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 45px 20px;

  background: #050505;

  color: #777;

  text-align: center;
}

footer strong {
  display: block;

  margin-bottom: 8px;

  color: white;

  letter-spacing: 3px;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

  .products {
    grid-template-columns:
      repeat(3,1fr);
  }

  .hero-content {
    width: 50%;
  }

  .sneaker-area {
    width: 55%;
  }

  .sneaker {
    transform:
      scale(.8)
      rotate(-13deg);
  }
}

/* =========================
   HANDY
========================= */

@media (max-width: 700px) {

  header {
    height: 62px;

    padding: 0 20px;
  }

  .hero {
    min-height: 700px;

    align-items: flex-start;
  }

  .hero-content {
    width: 100%;

    padding:
      65px 20px 0;

    text-align: center;
  }

  .hero h1 {
    font-size: 65px;

    letter-spacing: -4px;
  }

  .hero-text {
    margin:
      25px auto 0;

    font-size: 15px;
  }

  .sneaker-area {
    width: 100%;

    height: 45%;

    right: 0;

    bottom: 0;
  }

  .sneaker {
    right: -70px;
    bottom: 22%;

    transform:
      scale(.62)
      rotate(-13deg);
  }

  .impact {
    right: 15%;
    bottom: 18%;

    transform:
      scale(.7)
      perspective(300px)
      rotateX(65deg);
  }

  .crack {
    right: 5%;

    transform:
      scale(.7)
      perspective(350px)
      rotateX(65deg);
  }

  .shop {
    width: 92%;

    padding: 55px 0;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .products {
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap: 11px;
  }

  .product-info {
    padding: 12px;
  }

  .product-name {
    font-size: 14px;
  }

  .price {
    font-size: 15px;
  }

  .order-button {
    font-size: 9px;
  }
}

@media (max-width: 390px) {

  .products {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

          <option>44</option>
          <option>45</option>
          <option>46</option>

        </select>


        <button
          class="order-button"
          onclick="orderProduct(
            '${product.name}',
            '${product.brand}',
            '${product.price.toFixed(2).replace(".",",")} €',
            'size-${index}'
          )">

          ÜBER WHATSAPP BESTELLEN

        </button>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =========================================
   MARKENFILTER
========================================= */

function createBrandFilter() {

  const select =
    document.getElementById("brandFilter");

  const brands =
    [...new Set(
      products.map(product => product.brand)
    )];


  brands.forEach(brand => {

    const option =
      document.createElement("option");

    option.value = brand;

    option.textContent = brand;

    select.appendChild(option);

  });

}


/* =========================================
   FILTER
========================================= */

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const brand =
    document
      .getElementById("brandFilter")
      .value;

  const maxPrice =
    document
      .getElementById("priceFilter")
      .value;


  const filtered =
    products.filter(product => {

      const searchMatch =
        product.name
          .toLowerCase()
          .includes(search) ||

        product.brand
          .toLowerCase()
          .includes(search);


      const brandMatch =
        !brand ||
        product.brand === brand;


      const priceMatch =
        !maxPrice ||
        product.price <= Number(maxPrice);


      return (
        searchMatch &&
        brandMatch &&
        priceMatch
      );

    });


  renderProducts(filtered);

}


/* =========================================
   WHATSAPP
========================================= */

function orderProduct(
  product,
  brand,
  price,
  sizeId
) {

  const size =
    document
      .getElementById(sizeId)
      .value;


  if (!size) {

    alert(
      "Bitte zuerst eine Größe auswählen."
    );

    return;
  }


  /*
    HIER DEINE WHATSAPP-NUMMER EINTRAGEN.

    Beispiel:

    const phoneNumber = "491701234567";

    OHNE +
    OHNE Leerzeichen
  */

  const phoneNumber =
    "DEINE_NUMMER";


  const message =
    "Hallo Fastfashion,%0A%0A" +

    "Ich interessiere mich für:%0A" +

    "Marke: " +
    encodeURIComponent(brand) +

    "%0AProdukt: " +
    encodeURIComponent(product) +

    "%0APreis: " +
    encodeURIComponent(price) +

    "%0AGröße: " +
    encodeURIComponent(size);


  window.open(
    "https://wa.me/" +
    phoneNumber +
    "?text=" +
    message,
    "_blank"
  );

}


/* =========================================
   START
========================================= */

createBrandFilter();

renderProducts(products);

</script>
