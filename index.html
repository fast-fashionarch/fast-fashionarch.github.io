<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fastfashion | Sneaker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111;
    }
    /* =========================
       NAVIGATION
    ========================== */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      background: rgba(5, 15, 35, 0.94);
      backdrop-filter: blur(14px);
      color: white;
    }
    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    /* =========================
       ANIMIERTER HERO
    ========================== */
    .hero {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      background: #061a42;
    }
    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 45% 55% 60% 40%;
      filter: blur(8px);
      opacity: .9;
    }
    .hero::before {
      background:
        radial-gradient(circle at 30% 30%, white 0%, transparent 24%),
        radial-gradient(circle at 70% 60%, #1597ff 0%, transparent 45%),
        #08449b;
      animation: blueMove 8s ease-in-out infinite alternate;
    }
    .hero::after {
      background:
        radial-gradient(circle at 60% 30%, white 0%, transparent 20%),
        radial-gradient(circle at 30% 70%, #006cff 0%, transparent 48%),
        #0a4db5;
      animation: whiteMove 10s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }
    @keyframes blueMove {
      0% {
        transform: translate(-35%, -15%) rotate(0deg) scale(1);
      }
      50% {
        transform: translate(20%, 10%) rotate(90deg) scale(1.15);
      }
      100% {
        transform: translate(45%, -20%) rotate(180deg) scale(.9);
      }
    }
    @keyframes whiteMove {
      0% {
        transform: translate(40%, 15%) rotate(0deg) scale(1);
      }
      50% {
        transform: translate(-20%, -10%) rotate(-90deg) scale(1.2);
      }
      100% {
        transform: translate(-45%, 20%) rotate(-180deg) scale(.95);
      }
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 30px;
      text-shadow: 0 5px 25px rgba(0,0,0,.35);
    }
    .hero h1 {
      font-size: clamp(50px, 10vw, 100px);
      font-weight: 900;
      letter-spacing: -5px;
    }
    .hero p {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }
    .hero-button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 30px;
      border-radius: 30px;
      background: white;
      color: #0754b8;
      text-decoration: none;
      font-weight: bold;
      transition: .2s;
    }
    .hero-button:hover {
      transform: scale(1.05);
    }
    /* =========================
       SHOP
    ========================== */
    .shop {
      max-width: 1450px;
      margin: auto;
      padding: 55px 6%;
    }
    .section-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 25px;
    }
    /* =========================
       SUCHE & FILTER
    ========================== */
    .controls {
      display: grid;
      grid-template-columns:
        minmax(200px, 2fr)
        minmax(150px, 1fr)
        minmax(150px, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }
    .controls input,
    .controls select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 15px;
    }
    /* =========================
       PRODUKTE
    ========================== */
    .products {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
    }
    .product {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
      transition: .25s;
    }
    .product:hover {
      transform: translateY(-6px);
      box-shadow:
        0 15px 40px rgba(0,0,0,.15);
    }
    .product-image {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
      background: #e9eef5;
    }
    .product-info {
      padding: 20px;
    }
    .brand {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .product h3 {
      margin: 7px 0;
      font-size: 20px;
    }
    .price {
      font-size: 19px;
      font-weight: bold;
      margin: 12px 0;
    }
    .size-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
    }
    .size-select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .whatsapp {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #0754b8;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }
    .whatsapp:hover {
      background: #003d8f;
      transform: translateY(-2px);
    }
    .no-results {
      display: none;
      text-align: center;
      padding: 50px;
      color: #777;
    }
    /* =========================
       FOOTER
    ========================== */
    footer {
      margin-top: 30px;
      padding: 35px 20px;
      background: #061a42;
      color: #cbd5e1;
      text-align: center;
      font-size: 13px;
    }
    /* =========================
       HANDY
    ========================== */
    @media (max-width: 700px) {
      header {
        padding: 17px 20px;
      }
      .hero {
        min-height: 430px;
      }
      .hero h1 {
        letter-spacing: -3px;
      }
      .shop {
        padding: 40px 20px;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      .products {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .product {
        border-radius: 15px;
      }
      .product-image {
        height: 190px;
      }
      .product-info {
        padding: 13px;
      }
      .product h3 {
        font-size: 16px;
      }
      .price {
        font-size: 16px;
      }
      .whatsapp {
        font-size: 13px;
        padding: 12px 7px;
      }
    }
    @media (max-width: 400px) {
      .products {
        grid-template-columns: 1fr;
      }
      .product-image {
        height: 240px;
      }
    }
  </style>
</head>

    /*
    =====================================================
    PRODUKTE ANZEIGEN
    =====================================================
    */
    function renderProducts(list) {
      const container =
        document.getElementById("products");
      const noResults =
        document.getElementById("noResults");
      container.innerHTML = "";
      if (list.length === 0) {
        noResults.style.display = "block";
        return;
      }
      noResults.style.display = "none";
      list.forEach((product, index) => {
        const article =
          document.createElement("article");
        article.className = "product";
        article.innerHTML = `
          <img
            class="product-image"
            src="${product.image}"
            alt="${product.name}"
            onerror="this.src='https://placehold.co/900x700/e9eef5/777?text=Dein+Sneaker'">
          <div class="product-info">
            <span class="brand">
              ${product.brand}
            </span>
            <h3>
              ${product.name}
            </h3>
            <div class="price">
              ${product.price.toFixed(2).replace(".", ",")} €
            </div>
            <label
              class="size-label"
              for="size-${index}">
              Größe
            </label>
            <select
              class="size-select"
              id="size-${index}">
              <option value="">
                Größe auswählen
              </option>
              <option>36</option>
              <option>37</option>
              <option>38</option>
              <option>39</option>
              <option>40</option>
              <option>41</option>
              <option>42</option>
              <option>43</option>
              <option>44</option>
              <option>45</option>
              <option>46</option>
            </select>
            <button
              class="whatsapp"
              onclick="orderProduct(
                '${product.name.replace(/'/g, "\\'")}',
                '${product.price.toFixed(2).replace(".", ",")} €',
                'size-${index}'
              )">
              Über WhatsApp bestellen
            </button>
          </div>
        `;
        container.appendChild(article);
      });
    }
    /*
    =====================================================
    MARKENFILTER ERSTELLEN
    =====================================================
    */
    function createBrandFilter() {
      const select =
        document.getElementById("brandFilter");
      const brands =
        [...new Set(products.map(product => product.brand))];
      brands.forEach(brand => {
        const option =
          document.createElement("option");
        option.value = brand;
        option.textContent = brand;
        select.appendChild(option);
      });
    }
    /*
    =====================================================
    SUCHE & FILTER
    =====================================================
    */
    function filterProducts() {
      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase();
      const brand =
        document
          .getElementById("brandFilter")
          .value;
      const maxPrice =
        document
          .getElementById("priceFilter")
          .value;
      const filtered =
        products.filter(product => {
          const matchesSearch =
            product.name
              .toLowerCase()
              .includes(search) ||
            product.brand
              .toLowerCase()
              .includes(search);
          const matchesBrand =
            !brand ||
            product.brand === brand;
          const matchesPrice =
            !maxPrice ||
            product.price <= Number(maxPrice);
          return (
            matchesSearch &&
            matchesBrand &&
            matchesPrice
          );
        });
      renderProducts(filtered);
    }
    /*
    =====================================================
    WHATSAPP BESTELLUNG
    =====================================================
    */
    function orderProduct(
      product,
      price,
      sizeId
    ) {
      const size =
        document
          .getElementById(sizeId)
          .value;
      if (!size) {
        alert(
          "Bitte zuerst eine Größe auswählen."
        );
        return;
      }
      /*
      WICHTIG:
      Hier später deine WhatsApp-Nummer eintragen.
      Deutschland-Beispiel:
      491701234567
      OHNE:
      +
      Leerzeichen
      Klammern
      Bindestriche
      */
      const phoneNumber =
        "DEINE_NUMMER";
      const message =
        "Hallo Fastfashion,%0A%0A" +
        "ich interessiere mich für:%0A" +
        "Produkt: " +
        encodeURIComponent(product) +
        "%0A" +
        "Preis: " +
        encodeURIComponent(price) +
        "%0A" +
        "Größe: " +
        encodeURIComponent(size);
      const whatsappURL =
        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        message;
      window.open(
        whatsappURL,
        "_blank"
      );
    }

    createBrandFilter();
