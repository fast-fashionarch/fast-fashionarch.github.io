<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FASTFASHION | Sneaker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fb;
      color: #0b0d12;
    }

    /* =========================
       HEADER
    ========================== */

    header {
      position: sticky;
      top: 0;
      z-index: 999;

      height: 72px;
      padding: 0 6%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(255,255,255,.82);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .logo {
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 2px;
    }

    .nav-link {
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 570px;
      position: relative;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      background:
        radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 22%),
        linear-gradient(135deg, #061a42, #0874df, #ffffff, #0b4eb8);

      background-size: 180% 180%;

      animation: gradientMove 10s ease-in-out infinite alternate;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 30%;
      }

      50% {
        background-position: 100% 70%;
      }

      100% {
        background-position: 30% 100%;
      }
    }

    /* fließende Formen */

    .shape {
      position: absolute;
      border-radius: 50%;

      filter: blur(2px);

      opacity: .7;
    }

    .shape-one {
      width: 500px;
      height: 500px;

      background: rgba(255,255,255,.35);

      top: -180px;
      left: -120px;

      animation: floatOne 9s ease-in-out infinite alternate;
    }

    .shape-two {
      width: 650px;
      height: 650px;

      background: rgba(0,82,220,.45);

      right: -220px;
      bottom: -280px;

      animation: floatTwo 11s ease-in-out infinite alternate;
    }

    .shape-three {
      width: 300px;
      height: 300px;

      background: rgba(255,255,255,.5);

      right: 15%;
      top: 12%;

      animation: floatThree 7s ease-in-out infinite alternate;
    }

    @keyframes floatOne {
      from {
        transform: translate(0,0) rotate(0deg);
      }

      to {
        transform: translate(250px,180px) rotate(140deg);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate(0,0) scale(1);
      }

      to {
        transform: translate(-220px,-170px) scale(1.3);
      }
    }

    @keyframes floatThree {
      from {
        transform: translate(0,0) scale(1);
      }

      to {
        transform: translate(-120px,150px) scale(.7);
      }
    }

    .hero-content {
      position: relative;
      z-index: 5;

      max-width: 900px;

      padding: 30px;

      color: white;

      text-shadow: 0 8px 35px rgba(0,0,0,.22);
    }

    .small-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 4px;

      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(55px, 11vw, 125px);

      line-height: .9;

      font-weight: 950;

      letter-spacing: -7px;
    }

    .hero p {
      margin-top: 25px;

      font-size: clamp(17px, 3vw, 22px);

      font-weight: 700;
    }

    .hero-button {
      display: inline-block;

      margin-top: 35px;

      padding: 16px 32px;

      border-radius: 50px;

      background: white;

      color: #0754b8;

      text-decoration: none;

      font-size: 14px;
      font-weight: 900;

      box-shadow: 0 15px 40px rgba(0,0,0,.18);

      transition: .25s;
    }

    .hero-button:hover {
      transform: translateY(-4px) scale(1.04);
    }

    /* =========================
       SHOP
    ========================== */

    .shop {
      width: min(1450px, 92%);

      margin: auto;

      padding: 80px 0;
    }

    .shop-header {
      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 30px;
    }

    .shop-label {
      font-size: 11px;

      font-weight: 900;

      letter-spacing: 3px;

      color: #1269cf;

      margin-bottom: 8px;
    }

    .shop-title {
      font-size: clamp(35px, 5vw, 55px);

      font-weight: 950;

      letter-spacing: -2px;
    }

    .product-count {
      color: #777;

      font-size: 14px;
    }

    /* =========================
       FILTER
    ========================== */

    .controls {
      display: grid;

      grid-template-columns:
        2fr 1fr 1fr;

      gap: 12px;

      margin-bottom: 35px;
    }

    .controls input,
    .controls select {
      width: 100%;

      height: 52px;

      padding: 0 17px;

      border: 1px solid #e2e5eb;

      border-radius: 14px;

      background: white;

      color: #111;

      outline: none;

      font-size: 14px;

      transition: .2s;
    }

    .controls input:focus,
    .controls select:focus {
      border-color: #1774df;

      box-shadow: 0 0 0 4px rgba(23,116,223,.1);
    }

    /* =========================
       PRODUKTE
    ========================== */

    .products {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 20px;
    }

    .product {
      overflow: hidden;

      background: white;

      border-radius: 22px;

      border: 1px solid #e9ebef;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .product:hover {
      transform: translateY(-7px);

      box-shadow:
        0 25px 60px rgba(12,31,61,.12);
    }

    .image-wrapper {
      position: relative;

      overflow: hidden;

      background: #edf1f6;
    }

    .product-image {
      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      display: block;

      transition: transform .5s ease;
    }

    .product:hover .product-image {
      transform: scale(1.06);
    }

    .badge {
      position: absolute;

      top: 13px;
      left: 13px;

      padding: 7px 10px;

      border-radius: 20px;

      background: rgba(255,255,255,.9);

      backdrop-filter: blur(10px);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1px;
    }

    .product-info {
      padding: 18px;
    }

    .brand {
      color: #8a8f99;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .product-name {
      margin-top: 7px;

      font-size: 18px;

      font-weight: 900;
    }

    .price {
      margin: 10px 0 16px;

      font-size: 17px;

      font-weight: 900;
    }

    .size-select {
      width: 100%;

      height: 44px;

      padding: 0 12px;

      margin-bottom: 9px;

      border: 1px solid #dddfe5;

      border-radius: 10px;

      background: #fff;

      font-size: 13px;
    }

    .order-button {
      width: 100%;

      height: 45px;

      border: 0;

      border-radius: 11px;

      background: #0a0c10;

      color: white;

      cursor: pointer;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: .3px;

      transition: .2s;
    }

    .order-button:hover {
      background: #0754b8;

      transform: translateY(-2px);
    }

    /* =========================
       KEINE ERGEBNISSE
    ========================== */

    .no-results {
      display: none;

      padding: 70px 20px;

      text-align: center;

      color: #777;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      padding: 45px 20px;

      background: #070a10;

      color: #777;

      text-align: center;

      font-size: 12px;
    }

    footer strong {
      display: block;

      margin-bottom: 8px;

      color: white;

      font-size: 16px;

      letter-spacing: 2px;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 1050px) {

      .products {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    /* =========================
       HANDY
    ========================== */

    @media (max-width: 700px) {

      header {
        height: 64px;

        padding: 0 20px;
      }

      .logo {
        font-size: 19px;
      }

      .hero {
        min-height: 500px;
      }

      .hero h1 {
        letter-spacing: -4px;
      }

      .shop {
        width: 92%;

        padding: 55px 0;
      }

      .shop-header {
        display: block;
      }

      .product-count {
        margin-top: 8px;
      }

      .controls {
        grid-template-columns: 1fr;

        gap: 9px;
      }

      .products {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 11px;
      }

      .product {
        border-radius: 16px;
      }

      .product-info {
        padding: 12px;
      }

      .product-name {
        font-size: 15px;
      }

      .price {
        font-size: 15px;
      }

      .size-select,
      .order-button {
        height: 42px;
      }

      .order-button {
        font-size: 10px;
      }

      .badge {
        top: 8px;
        left: 8px;

        font-size: 8px;

        padding: 5px 8px;
      }
    }

    @media (max-width: 390px) {

      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    /*

    */

    function renderProducts(list) {

      const container =
        document.getElementById("products");

      const noResults =
        document.getElementById("noResults");

      const count =
        document.getElementById("productCount");

      container.innerHTML = "";

      count.textContent =
        list.length + " Produkte";


      if (list.length === 0) {

        noResults.style.display = "block";

        return;
      }


      noResults.style.display = "none";


      list.forEach((product, index) => {

        const article =
          document.createElement("article");

        article.className = "product";


        article.innerHTML = `

          <div class="image-wrapper">

            <span class="badge">
              FASTFASHION
            </span>

            <img
              class="product-image"
              src="${product.image}"
              alt="${product.name}"

          </div>


          <div class="product-info">

            <div class="brand">
              ${product.brand}
            </div>

            <div class="product-name">
              ${product.name}
            </div>

            <div class="price">
              ${product.price.toFixed(2).replace(".", ",")} €
            </div>


            <select
              class="size-select"

    /*
    =====================================================
    MARKENFILTER
    =====================================================
    */

    function createBrandFilter() {

      const select =
        document.getElementById("brandFilter");

      const brands =
        [...new Set(
          products.map(product => product.brand)
        )];


      brands.forEach(brand => {

        const option =
          document.createElement("option");

        option.value = brand;

        option.textContent = brand;

        select.appendChild(option);

      });

    }


    /*
    =====================================================
    SUCHE / FILTER
    =====================================================
    */

    function filterProducts() {

      const search =
        document
          .getElementById("search")
          .value
          .toLowerCase();


      const brand =
        document
          .getElementById("brandFilter")
          .value;


      const maxPrice =
        document
          .getElementById("priceFilter")
          .value;


      const filtered =
        products.filter(product => {

          const searchMatch =
            product.name
              .toLowerCase()
              .includes(search) ||

            product.brand
              .toLowerCase()
              .includes(search);


          const brandMatch =
            !brand ||
            product.brand === brand;


          const priceMatch =
            !maxPrice ||
            product.price <= Number(maxPrice);


          return (
            searchMatch &&
            brandMatch &&
            priceMatch
          );

        });


      renderProducts(filtered);

    }


    /*
    =====================================================
    WHATSAPP
    =====================================================
    */

    function orderProduct(
      product,
      brand,
      price,
      sizeId
    ) {

      const size =
        document
          .getElementById(sizeId)
          .value;


      if (!size) {

        alert(
          "Bitte zuerst eine Größe auswählen."
        );

        return;
      }


      /*
      =================================================
      DEINE WHATSAPP-NUMMER

      Später hier eintragen.

      Beispiel Deutschland:

      491701234567

      Ohne +, Leerzeichen oder Klammern.
      =================================================
      */

      const phoneNumber =
        "DEINE_NUMMER";


      const message =
        "Hallo Fastfashion,%0A%0A" +

        "ich interessiere mich für:%0A" +

        "Marke: " +
        encodeURIComponent(brand) +

        "%0A" +

        "Produkt: " +
        encodeURIComponent(product) +

        "%0A" +

        "Preis: " +
        encodeURIComponent(price) +

        "%0A" +

        "Größe: " +
        encodeURIComponent(size);


      const url =
        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        message;


      window.open(
        url,
        "_blank"
      );

    }


    /*
    =====================================================
    START
    =====================================================
    */

    createBrandFilter();

    renderProducts(products);

  </script>
