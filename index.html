<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTFASHION | Sneaker</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: white;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 1000;

  height: 72px;
  padding: 0 6%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  background: rgba(8,8,8,.9);
  backdrop-filter: blur(15px);

  border-bottom: 1px solid rgba(255,255,255,.08);
}

.logo {
  font-size: 22px;
  font-weight: 1000;
  letter-spacing: 3px;
}

.nav-link {
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
}

/* =========================
   HERO
========================= */

.hero {
  min-height: 650px;
  position: relative;
  overflow: hidden;

  display: flex;
  align-items: center;

  background:
    radial-gradient(circle at 75% 45%, rgba(255,50,50,.55), transparent 25%),
    radial-gradient(circle at 15% 80%, rgba(150,0,0,.7), transparent 30%),
    linear-gradient(135deg, #120000, #b40000 45%, #260000);
}

/* bewegende rote Flächen */

.hero::before {
  content: "";

  position: absolute;

  width: 900px;
  height: 900px;

  right: -350px;
  top: -300px;

  border-radius: 45% 55% 50% 50%;

  background:
    radial-gradient(circle, #ff3030, transparent 55%);

  filter: blur(20px);

  animation: redMove 8s ease-in-out infinite alternate;
}

@keyframes redMove {
  from {
    transform: rotate(0deg) scale(1);
  }

  to {
    transform: rotate(120deg) scale(1.3);
  }
}

/* schwarze Linien */

.hero-lines {
  position: absolute;
  inset: 0;

  opacity: .2;

  background:
    repeating-linear-gradient(
      -25deg,
      transparent 0px,
      transparent 80px,
      #000 81px,
      transparent 83px
    );
}

/* =========================
   HERO TEXT
========================= */

.hero-content {
  position: relative;
  z-index: 5;

  width: 55%;

  padding-left: 7%;
}

.hero-label {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 5px;

  margin-bottom: 18px;
}

.hero h1 {
  font-size: clamp(60px, 10vw, 135px);

  line-height: .82;

  font-weight: 1000;

  letter-spacing: -7px;

  text-transform: uppercase;
}

.hero h1 span {
  color: #ff2525;
  -webkit-text-stroke: 1px white;
}

.hero-text {
  margin-top: 30px;

  max-width: 450px;

  font-size: 18px;

  font-weight: 700;

  line-height: 1.5;
}

.hero-button {
  display: inline-block;

  margin-top: 30px;

  padding: 16px 32px;

  background: white;

  color: #080808;

  border-radius: 50px;

  text-decoration: none;

  font-size: 13px;

  font-weight: 1000;

  transition: .25s;
}

.hero-button:hover {
  transform: translateY(-4px) scale(1.04);

  background: #ff2525;

  color: white;
}

/* =========================
   SNEAKER HERO MOTIV
========================= */

.sneaker-stage {
  position: absolute;

  z-index: 4;

  right: 4%;
  bottom: 7%;

  width: 48%;
  height: 80%;

  display: flex;
  justify-content: center;
  align-items: center;
}

/*
  Hier kannst du später dein eigenes
  Hero-Bild einsetzen.

  Datei:
  bilder/hero-sneaker.png
*/

.hero-sneaker {
  width: 90%;

  max-width: 700px;

  object-fit: contain;

  filter:
    drop-shadow(0 35px 25px rgba(0,0,0,.7))
    drop-shadow(0 0 35px rgba(255,0,0,.35));

  transform: rotate(-9deg);

  animation: sneakerFloat 4s ease-in-out infinite alternate;
}

@keyframes sneakerFloat {
  from {
    transform:
      rotate(-9deg)
      translateY(0);
  }

  to {
    transform:
      rotate(-5deg)
      translateY(-18px);
  }
}

/* =========================
   BODENRISS
========================= */

.crack {
  position: absolute;

  bottom: 8%;

  width: 460px;
  height: 80px;

  transform: perspective(300px) rotateX(55deg);

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      #000 25%,
      transparent 26%,
      transparent 37%,
      #000 38%,
      transparent 40%,
      transparent 60%,
      #000 61%,
      transparent 63%,
      transparent 75%,
      #000 76%,
      transparent 78%
    );

  filter: blur(.5px);

  opacity: .9;
}

/* =========================
   SHOP
========================= */

.shop {
  width: min(1450px, 92%);

  margin: auto;

  padding: 80px 0;
}

.shop-label {
  color: #ff3030;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 4px;

  margin-bottom: 8px;
}

.shop-title {
  font-size: clamp(40px, 6vw, 70px);

  font-weight: 1000;

  letter-spacing: -4px;

  margin-bottom: 30px;
}

/* =========================
   FILTER
========================= */

.controls {
  display: grid;

  grid-template-columns: 2fr 1fr 1fr;

  gap: 12px;

  margin-bottom: 35px;
}

.controls input,
.controls select {
  width: 100%;

  height: 52px;

  padding: 0 16px;

  border-radius: 12px;

  border: 1px solid #292929;

  background: #111;

  color: white;

  outline: none;
}

.controls input:focus,
.controls select:focus {
  border-color: #ff3030;
}

/* =========================
   PRODUKTE
========================= */

.products {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 20px;
}

.product {
  background: #111;

  border: 1px solid #242424;

  border-radius: 18px;

  overflow: hidden;

  transition: .3s;
}

.product:hover {
  transform: translateY(-7px);

  border-color: #ff3030;

  box-shadow:
    0 20px 60px rgba(255,0,0,.12);
}

.image-wrapper {
  position: relative;

  background: #191919;

  overflow: hidden;
}

.product-image {
  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  display: block;

  transition: .4s;
}

.product:hover .product-image {
  transform: scale(1.06);
}

.badge {
  position: absolute;

  top: 12px;
  left: 12px;

  padding: 6px 9px;

  border-radius: 20px;

  background: #ff2020;

  color: white;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.product-info {
  padding: 17px;
}

.brand {
  color: #888;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 2px;
}

.product-name {
  margin-top: 6px;

  font-size: 17px;

  font-weight: 900;
}

.price {
  margin: 10px 0 15px;

  font-size: 17px;

  font-weight: 900;
}

.size-select {
  width: 100%;

  height: 43px;

  margin-bottom: 9px;

  padding: 0 10px;

  border-radius: 9px;

  border: 1px solid #303030;

  background: #080808;

  color: white;
}

.order-button {
  width: 100%;

  height: 44px;

  border: none;

  border-radius: 9px;

  background: #ff2020;

  color: white;

  font-size: 11px;

  font-weight: 1000;

  cursor: pointer;

  transition: .2s;
}

.order-button:hover {
  background: #d90000;

  transform: translateY(-2px);
}

/* =========================
   FOOTER
========================= */

footer {
  padding: 45px 20px;

  background: #050505;

  color: #777;

  text-align: center;
}

footer strong {
  display: block;

  margin-bottom: 8px;

  color: white;

  letter-spacing: 3px;
}

/* =========================
   HANDY
========================= */

@media (max-width: 1000px) {

  .products {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .hero-content {
    width: 50%;
  }

  .sneaker-stage {
    width: 55%;
  }
}

@media (max-width: 700px) {

  header {

    padding: 0 20px;

  }

  }

    letter-spacing: -4px;
  }

  .hero-text {
    margin: 25px auto 0;

    font-size: 15px;
  }

  .sneaker-stage {
    width: 100%;

    height: 42%;

    right: 0;

    bottom: 0;
  }

  .hero-sneaker {
    width: 90%;
  }

  .crack {
    width: 280px;
  }

  .shop {
    width: 92%;

    padding: 55px 0;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .products {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 11px;
  }

  .product-info {
    padding: 12px;
  }

  .product-name {
    font-size: 14px;
  }

  .price {
    font-size: 15px;
  }

  .order-button {
    font-size: 9px;
  }
}

@media (max-width: 390px) {

  .products {
    grid-template-columns: 1fr;
  }
}
</style>

/* =========================================
   MARKENFILTER
========================================= */

function createBrandFilter() {

  const select =
    document.getElementById("brandFilter");

  const brands =
    [...new Set(
      products.map(product => product.brand)
    )];


  brands.forEach(brand => {

    const option =
      document.createElement("option");

    option.value = brand;

    option.textContent = brand;

    select.appendChild(option);

  });

}


/* =========================================
   FILTER
========================================= */

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const brand =
    document
      .getElementById("brandFilter")
      .value;

  const maxPrice =
    document
      .getElementById("priceFilter")
      .value;


  const filtered =
    products.filter(product => {

      const matchesSearch =
        product.name
          .toLowerCase()
          .includes(search) ||

        product.brand
          .toLowerCase()
          .includes(search);


      const matchesBrand =
        !brand ||
        product.brand === brand;


      const matchesPrice =
        !maxPrice ||
        product.price <= Number(maxPrice);


      return (
        matchesSearch &&
        matchesBrand &&
        matchesPrice
      );

    });


  renderProducts(filtered);

}

    "%0AProdukt: " +
    encodeURIComponent(product) +

    "%0APreis: " +
    encodeURIComponent(price) +

    "%0AGröße: " +
    encodeURIComponent(size);


  const url =
    "https://wa.me/" +
    phoneNumber +
    "?text=" +
    message;


  window.open(
    url,
    "_blank"
  );

}
