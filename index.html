 <!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fastfashion | Sneaker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .hero h1 {
      font-size: clamp(45px, 9vw, 90px);
      font-weight: 900;
      letter-spacing: -4px;
    }

    .hero p {
      margin-top: 15px;
      font-size: 18px;
    }

    .shop {
      padding: 55px 6%;
      max-width: 1400px;
      margin: auto;
    }

    .section-title {
      font-size: 34px;
      margin-bottom: 30px;
      font-weight: 900;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .product:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,.14);
    }

    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 20px;
    }

    .brand {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product h3 {
      margin: 7px 0;
      font-size: 20px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      margin: 12px 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .whatsapp {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 13px;
      background: #111;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: .2s;
    }

    .whatsapp:hover {
      background: #333;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      margin-top: 30px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px 20px;
      }

      nav a {
        margin-left: 10px;
      }

      .hero {
        min-height: 360px;
      }

      .shop {
        padding: 40px 20px;
      }

      .product img {
        height: 230px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">FASTFASHION</div>

    <nav>
      <a href="#shop">Sneaker</a>
    </nav>
  </header>

  <section class="hero">
    <div>
      <h1>FASTFASHION</h1>
      <p>Dein Style. Deine Sneaker.</p>
    </div>
  </section>

  <main class="shop" id="shop">

    <h2 class="section-title">Sneaker</h2>

    <div class="products">

      <!-- PRODUKT 1 -->
      <article class="product">
        <img
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80"
          alt="Roter Sneaker"
        >

        <div class="product-info">
          <span class="brand">Sneaker</span>
          <h3>Classic Red</h3>
          <div class="price">99,99 €</div>

          <label for="size1">Größe</label>

          <select id="size1">
            <option value="">Größe auswählen</option>
            <option>36</option>
            <option>37</option>
            <option>38</option>
            <option>39</option>
            <option>40</option>
            <option>41</option>
            <option>42</option>
            <option>43</option>
            <option>44</option>
            <option>45</option>
            <option>46</option>
          </select>

          <button class="whatsapp"
            onclick="orderProduct('Classic Red', '99,99 €', 'size1')">
            Über WhatsApp bestellen
          </button>
        </div>
      </article>


      <!-- PRODUKT 2 -->
      <article class="product">
        <img
          src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=900&q=80"
          alt="Weißer Sneaker"
        >

        <div class="product-info">
          <span class="brand">Sneaker</span>
          <h3>White Street</h3>
          <div class="price">119,99 €</div>

          <label for="size2">Größe</label>

          <select id="size2">
            <option value="">Größe auswählen</option>
            <option>36</option>
            <option>37</option>
            <option>38</option>
            <option>39</option>
            <option>40</option>
            <option>41</option>
            <option>42</option>
            <option>43</option>
            <option>44</option>
            <option>45</option>
            <option>46</option>
          </select>

          <button class="whatsapp"
            onclick="orderProduct('White Street', '119,99 €', 'size2')">
            Über WhatsApp bestellen
          </button>
        </div>
      </article>


      <!-- PRODUKT 3 -->
      <article class="product">
        <img
          src="https://images.unsplash.com/photo-1543508282-6319a3e2621f?auto=format&fit=crop&w=900&q=80"
          alt="Schwarzer Sneaker"
        >

        <div class="product-info">
          <span class="brand">Sneaker</span>
          <h3>Black Premium</h3>
          <div class="price">129,99 €</div>

          <label for="size3">Größe</label>

          <select id="size3">
            <option value="">Größe auswählen</option>
            <option>36</option>
            <option>37</option>
            <option>38</option>
            <option>39</option>
            <option>40</option>
            <option>41</option>
            <option>42</option>
            <option>43</option>
            <option>44</option>
            <option>45</option>
            <option>46</option>
          </select>

          <button class="whatsapp"
            onclick="orderProduct('Black Premium', '129,99 €', 'size3')">
            Über WhatsApp bestellen
          </button>
        </div>
      </article>

    </div>
  </main>

  <footer>
    © 2026 Fastfashion · Sneaker & Streetwear
  </footer>


  <script>
    function orderProduct(product, price, sizeId) {

      const size = document.getElementById(sizeId).value;

      if (!size) {
        alert("Bitte zuerst eine Größe auswählen.");
        return;
      }

      /*
        WICHTIG:
        Ersetze DEINE_NUMMER durch deine WhatsApp-Nummer.

        Beispiel Deutschland:
        491701234567

        Keine + Zeichen, Leerzeichen oder Klammern.
      */

      const phoneNumber = "DEINE_NUMMER";

      const message =
        "Hallo Fastfashion,%0A%0A" +
        "ich möchte diesen Sneaker bestellen:%0A" +
        "Produkt: " + product + "%0A" +
        "Preis: " + price + "%0A" +
        "Größe: " + size;

      const whatsappURL =
        "https://wa.me/" + phoneNumber + "?text=" + message;

      window.open(whatsappURL, "_blank");
    }
  </script>

</body>
</html>
